<text x="695" y="599" text-anchor="middle" class="head">Amazon Aurora MySQL</text>
<text x="695" y="622" text-anchor="middle" class="body">saielectronics | products, customers, orders, order_items</text>
<path d="M695 510 V570" class="edge"/>
<text x="711" y="548" class="small">SQL / DB connection</text>

