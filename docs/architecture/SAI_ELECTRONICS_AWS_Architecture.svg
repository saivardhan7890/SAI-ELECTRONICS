<rect x="1240" y="555" width="170" height="86" fill="#f2eafe" stroke="#8b68c7" class="node"/>
<text x="1325" y="589" text-anchor="middle" class="head">AWS CloudTrail</text><text x="1325" y="614" text-anchor="middle" class="body">Multi-region activity</text>
