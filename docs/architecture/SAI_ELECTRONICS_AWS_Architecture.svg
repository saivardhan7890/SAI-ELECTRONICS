<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">SAI ELECTRONICS — deployed AWS architecture</title>
<desc id="d">Customer website traffic resolves through Route 53 and reaches an internet-facing Application Load Balancer using an ACM certificate. The ALB forwards to a private EC2 Nginx server. Browser API calls use API Gateway and Lambda to access Aurora MySQL with credentials from Secrets Manager. S3 stores frontend assets and CloudTrail logs, CloudWatch stores Lambda logs, and Athena queries CloudTrail data.</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#45637e"/></marker>
 <style>
 .title{font:700 28px Arial;fill:#fff}.subtitle{font:15px Arial;fill:#dbe9f5}.heading{font:700 17px Arial;fill:#1e3b55}.nodeTitle{font:700 16px Arial;fill:#19344d}.nodeText{font:13px Arial;fill:#31516c}.label{font:12px Arial;fill:#45637e}.box{stroke-width:2;rx:12}.edge{stroke:#45637e;stroke-width:2.2;fill:none;marker-end:url(#a)}.dashed{stroke-dasharray:7 5}
 </style>
