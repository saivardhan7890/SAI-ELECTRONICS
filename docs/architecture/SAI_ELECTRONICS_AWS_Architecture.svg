<rect x="1000" y="285" width="190" height="86" fill="#fce9f0" stroke="#c65b82" class="node"/>
<text x="1095" y="319" text-anchor="middle" class="head">Secrets Manager</text><text x="1095" y="344" text-anchor="middle" class="body">Database credentials</text>
<path d="M1190 328 H1325 V211" class="edge dash"/>

<!-- S3 frontend -->
<rect x="1000" y="420" width="190" height="86" fill="#fff4df" stroke="#d69b31" class="node"/>
<text x="1095" y="454" text-anchor="middle" class="head">Amazon S3</text><text x="1095" y="479" text-anchor="middle" class="body">Frontend asset bucket</text>
<path d="M1000 463 H945 V460 H870" class="edge dash"/>
