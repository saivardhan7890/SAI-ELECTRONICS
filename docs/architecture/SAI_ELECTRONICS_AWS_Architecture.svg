<!-- monitoring and audit -->
<rect x="1000" y="555" width="190" height="86" fill="#f2eafe" stroke="#8b68c7" class="node"/>
<text x="1095" y="589" text-anchor="middle" class="head">Amazon CloudWatch</text><text x="1095" y="614" text-anchor="middle" class="body">Lambda execution logs</text>
