<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">SAI ELECTRONICS deployed AWS architecture</title>
<desc id="desc">Route 53 and ACM secure an internet-facing Application Load Balancer which forwards website traffic to a private EC2 Nginx server. Browser API calls go through API Gateway and Lambda to Aurora MySQL, with credentials from Secrets Manager. S3 stores frontend assets and CloudTrail audit logs. CloudWatch stores Lambda logs and Athena queries CloudTrail logs.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#47647f"/></marker>
  <style>
    .h1{font:700 30px Arial;fill:#fff}.sub{font:16px Arial;fill:#dce9f6}
    .section{font:700 18px Arial;fill:#24415c}.node{stroke-width:2;rx:12}
    .head{font:700 17px Arial;fill:#17324a}.body{font:14px Arial;fill:#27445e}
    .small{font:12px Arial;fill:#48637b}.edge{stroke:#47647f;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
    .dash{stroke-dasharray:7 5}
  </style>
</defs>
<rect width="1440" height="980" fill="#f5f8fc"/>
<rect x="0" y="0" width="1440" height="84" fill="#15375b"/>
<text x="48" y="42" class="h1">SAI ELECTRONICS</text>
<text x="48" y="67" class="sub">AWS E-Commerce Platform | Deployed Architecture | us-east-1</text>

<!-- user and DNS row -->
<rect x="48" y="125" width="190" height="86" fill="#eaf2ff" stroke="#4c78a8" class="node"/>
<text x="143" y="159" text-anchor="middle" class="head">Customers</text><text x="143" y="184" text-anchor="middle" class="body">Browser / HTTPS</text>
<rect x="300" y="125" width="190" height="86" fill="#fff4df" stroke="#d69b31" class="node"/>
<text x="395" y="159" text-anchor="middle" class="head">Amazon Route 53</text><text x="395" y="184" text-anchor="middle" class="body">saivardhan.online</text>
<rect x="565" y="125" width="210" height="86" fill="#fce9f0" stroke="#c65b82" class="node"/>
<text x="670" y="159" text-anchor="middle" class="head">AWS Certificate Manager</text><text x="670" y="184" text-anchor="middle" class="body">Issued TLS certificate</text>
<path d="M238 168 H300" class="edge"/><text x="266" y="154" class="small" text-anchor="middle">DNS</text>
<path d="M490 168 H565" class="edge"/><text x="526" y="154" class="small" text-anchor="middle">DNS alias</text>

<!-- VPC boundary -->
<rect x="48" y="270" width="900" height="540" rx="18" fill="#edf4fb" stroke="#5d8fbd" stroke-width="2.5"/>
<text x="76" y="307" class="section">Amazon VPC — application and database network</text>
<rect x="80" y="340" width="360" height="425" rx="14" fill="#f6fbff" stroke="#9bbbd8" stroke-width="2"/>
<text x="104" y="373" class="section">Public subnet layer</text>
<rect x="110" y="405" width="300" height="96" fill="#e5f4ea" stroke="#3d9b65" class="node"/>
<text x="260" y="441" text-anchor="middle" class="head">Application Load Balancer</text>
<text x="260" y="466" text-anchor="middle" class="body">HTTPS :443 | HTTP :80 → redirect</text>
<rect x="110" y="535" width="300" height="66" fill="#fce9f0" stroke="#c65b82" class="node"/>
<text x="260" y="562" text-anchor="middle" class="head">ACM certificate attached</text>
<text x="260" y="583" text-anchor="middle" class="body">TLS termination at ALB</text>
<path d="M260 535 V501" class="edge"/>
<rect x="110" y="635" width="300" height="88" fill="#eaf2ff" stroke="#4c78a8" class="node"/>
<text x="260" y="670" text-anchor="middle" class="head">ALB Target Group</text>
<text x="260" y="696" text-anchor="middle" class="body">EC2 target | HTTP :80</text>
<path d="M260 501 V635" class="edge"/>

<rect x="475" y="340" width="440" height="425" rx="14" fill="#f7fbff" stroke="#9bbbd8" stroke-width="2"/>
<text x="499" y="373" class="section">Private application / database layers</text>
<rect x="520" y="410" width="350" height="100" fill="#eaf2ff" stroke="#4c78a8" class="node"/>
<text x="695" y="446" text-anchor="middle" class="head">Amazon EC2</text>
<text x="695" y="471" text-anchor="middle" class="body">Nginx | serves HTML / CSS / JavaScript</text>
<text x="695" y="491" text-anchor="middle" class="small">Managed administration via Systems Manager</text>
<path d="M410 680 C455 680 465 460 520 460" class="edge"/>
