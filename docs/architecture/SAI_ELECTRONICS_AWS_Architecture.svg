<path d="M1325 641 V685" class="edge"/><path d="M1240 728 H1190" class="edge"/>
<rect x="1000" y="825" width="410" height="78" fill="#edf7f0" stroke="#54a46a" class="node"/>
<text x="1205" y="857" text-anchor="middle" class="head">Athena query results — separate S3 bucket</text>
<text x="1205" y="881" text-anchor="middle" class="body">SSE-S3 encrypted output location</text>
<path d="M1325 771 V825" class="edge"/>

<text x="48" y="865" class="small">Connection legend: solid arrows = request / data flow; dashed arrows = configuration, credentials, deployment or log flow.</text>
<text x="48" y="891" class="small">Diagram reflects the discussed deployment: EC2/Nginx frontend, API Gateway + Lambda backend, Aurora MySQL, S3, CloudWatch, CloudTrail and Athena.</text>
</svg>